# Name of your application. Used to uniquely configure containers.
service: ilv_store

# Name of the container image (use your-user/app-name on external registries).
image: ilv_store

# Deploy to these servers. Same physical server as medistock and easy-loans —
# see docs/plans/01-kamal-mibotica-deployment.md for how the apps share it.
servers:
  web:
    - <%= ENV.fetch("SERVER_IP", "192.168.0.1") %>
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# kamal-proxy is a single container SHARED across every Kamal app on this
# server (not one per app) — it was already booted by medistock on 8080/8443,
# and stays there. Do NOT set proxy.run.http_port/https_port here: this is
# global proxy config, not per-app, and changing it (or running
# `kamal proxy reboot` from this repo) would rebind the shared proxy's ports
# out from under medistock's Caddy config, which expects 8080/8443.
# TLS is terminated by Caddy (owned by medistock's Kamal config, since it must
# hold ports 80/443 for the whole server), which reverse-proxies both hosts
# below to the shared proxy at localhost:8080.
proxy:
  ssl: false
  hosts:
    - tienda.ilvmx.org
    - tienda.mibotica.app

# Local registry — Kamal handles the tunnel automatically (same technique as
# medistock and easy-loans; this is per local machine, not per server).
registry:
  server: localhost:5555

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - UNI_ONE_API_KEY
    - SENTRY_DSN
    - SENTRY_ENABLED_ENVIRONMENTS
    - CLOUDFLARE_R2_JURISDICTION_ENDPOINT
    - CLOUDFLARE_R2_ACCESS_KEY_ID
    - CLOUDFLARE_R2_SECRET_ACCESS_KEY
    - CLOUDFLARE_R2_BUCKET_NAME
    - STRIPE_PUBLISH_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - TYPESENSE_API_KEY
    - SALES_EMAIL_ADDRESS
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Canonical host, used by ActionMailer's default_url_options/asset_host.
    APP_HOST: tienda.ilvmx.org

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use ilv_store-db for a db accessory server on same machine via local kamal docker network.
    POSTGRES_HOST: ilv_store-db

    # Typesense configuration
    TYPESENSE_HOST: ilv_store-typesense
    TYPESENSE_PORT: 8108
    TYPESENSE_PROTOCOL: http

    # Log everything from Rails (includes potentially personally-identifiable information!)
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  typesense-reindex: app exec "bin/rails typesense:recreate"


# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "ilv_store_storage:/rails/storage"


# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.1
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Same server as medistock and easy-loans, so the same non-default SSH
# port/user they're already configured with.
ssh:
  port: 20202
  user: deploy

# Dedicated Postgres/Typesense instances (not shared with the other apps).
accessories:
  db:
    image: postgres:18.6
    host: <%= ENV.fetch("SERVER_IP", "192.168.0.1") %>
    # 5432 is medistock's db, 5433 easy-loans' db, 5434 medistock's self-hosted CI
    port: "127.0.0.1:5436:5432"
    env:
      clear:
        POSTGRES_USER: rails
        POSTGRES_DB: postgres
      secret:
        - POSTGRES_PASSWORD
    files:
     # - config/mysql/production.cnf:/etc/mysql/my.cnf
      - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      # Postgres 18+ keeps its data under /var/lib/postgresql/18/docker
      - data:/var/lib/postgresql

  typesense:
    image: typesense/typesense:26.0
    host: <%= ENV.fetch("SERVER_IP", "192.168.0.1") %>
    port: "127.0.0.1:8108:8108"
    env:
      clear:
        TYPESENSE_DATA_DIR: /data
      secret:
        - TYPESENSE_API_KEY
    directories:
      - typesense-data:/data
    cmd: --enable-cors
    options:
      health-cmd: "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8108' || exit 1"
      health-interval: "10s"
      health-timeout: "5s"
      health-retries: "6"
      health-start-period: "60s"
